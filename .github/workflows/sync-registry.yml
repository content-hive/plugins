name: Sync registry

on:
  push:
    branches:
      - main
      - release

concurrency:
  group: sync-registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-registry:
    if: ${{ !startsWith(github.event.head_commit.message, '[generate]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check manifests
        run: |
          args=()
          if [[ "${{ github.ref_name }}" == "release" ]]; then
            args+=(--require-stable)
          fi
          python3 scripts/check_manifests.py "${args[@]}"

      - name: Generate registry
        run: python3 scripts/generate_registry.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json CHANGELOG.md plugins/*/CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No generated file changes"
          else
            git commit -m "[generate] regenerate registry"
            git push
          fi

      - name: Create tags for version bumps
        run: bash scripts/create_plugin_tags.sh
