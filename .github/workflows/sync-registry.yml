name: Sync registry

on:
  push:
    branches:
      - main
      - release

concurrency:
  group: sync-registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Only bot [generate] commits skip regenerate (avoid loops). Still run tagging
      # so a failed tag step can be retried when the generate push re-triggers this job.
      - name: Detect bot generate commit
        id: meta
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$COMMIT_MSG" == \[generate\]* && "$COMMIT_EMAIL" == "$bot_email" ]]; then
            echo "skip_generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_generate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check manifests
        if: steps.meta.outputs.skip_generate != 'true'
        run: |
          args=()
          if [[ "${{ github.ref_name }}" == "release" ]]; then
            args+=(--require-stable)
          fi
          python3 scripts/check_manifests.py "${args[@]}"

      - name: Generate registry
        if: steps.meta.outputs.skip_generate != 'true'
        run: python3 scripts/generate_registry.py

      - name: Commit and push generated files
        if: steps.meta.outputs.skip_generate != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json CHANGELOG.md plugins/*/CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No generated file changes"
          else
            git commit -m "[generate] regenerate registry"
            git push
          fi

      - name: Create tags for version bumps
        run: bash scripts/create_plugin_tags.sh
