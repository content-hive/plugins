name: Validate and sync registry

on:
  pull_request:
    branches:
      - main
      - release
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure same-repository PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Only same-repository PRs are supported (CI must push generated files to the PR branch)."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip bot generate commits
        id: skip
        run: |
          msg="$(git log -1 --pretty=%s)"
          echo "head_commit=$msg"
          if [[ "$msg" == \[generate\]* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check manifests
        if: steps.skip.outputs.skip != 'true'
        run: |
          args=()
          if [[ "${{ github.base_ref }}" == "release" ]]; then
            args+=(--require-stable)
          fi
          python3 scripts/check_manifests.py "${args[@]}"

      - name: Generate registry
        if: steps.skip.outputs.skip != 'true'
        run: python3 scripts/generate_registry.py

      - name: Commit and push generated files
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json CHANGELOG.md plugins/*/CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No generated file changes"
            exit 0
          fi
          git commit -m "[generate] regenerate registry"
          git push
